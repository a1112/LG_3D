[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lg3d-service-monitor"
version = "1.0.0"
description = "Windows service and disk monitor for LG_3D"
requires-python = "==3.11.*"
dependencies = [
  "PySide6==6.8.1",
  "psutil==6.1.0",
  "pywin32==308",
  "icoextract==0.1.5",
]

[project.optional-dependencies]
build = [
  "PyInstaller==6.11.1",
  "pytest>=8.0,<9",
]

[project.scripts]
lg3d-service-monitor = "lg3d_service_monitor.application:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
